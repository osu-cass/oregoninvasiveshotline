name: Playwright Tests

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      CI: true
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      GOOGLE_MAP_ID: ${{ secrets.GOOGLE_MAP_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create Docker secrets directory
        run: |
          mkdir -p docker/secrets
          printf '%s' 'test-secret-key-for-ci' > docker/secrets/secret_key.txt
          printf '%s' 'invasives' > docker/secrets/db_password.txt
          printf '%s' "$GOOGLE_API_KEY" > docker/secrets/google_api_key.txt
          printf '%s' "$GOOGLE_MAP_ID" > docker/secrets/google_map_id.txt
          chmod 600 docker/secrets/*.txt 

      - name: Set up environment variables
        run: |
          echo "USER_ID=$(id -u)" >> "$GITHUB_ENV"
          echo "GROUP_ID=$(id -g)" >> "$GITHUB_ENV"
          echo "VOLUME_PATH=./volumes" >> "$GITHUB_ENV"

      - name: Create volume directories
        run: |
          mkdir -p "${VOLUME_PATH}/media" "${VOLUME_PATH}/static"
          chown -R "${USER_ID}:${GROUP_ID}" "${VOLUME_PATH}/media" "${VOLUME_PATH}/static"

      - name: Install dependencies
        run: npm ci

      - name: Start application services
        run: docker compose up --build -d postgres rabbitmq app vite

      - name: Wait for application services
        run: |
          until curl --fail --silent http://localhost:5173/@vite/client > /dev/null; do
            echo "Waiting for Vite dev server..."
            sleep 5
          done

          until curl --fail --silent http://localhost:8000/reports/create-new > /dev/null; do
            echo "Waiting for Django app..."
            sleep 5
          done

      - name: Seed database fixtures
        run: >
          docker compose exec -T app /opt/venv/bin/python manage.py loaddata
          oregoninvasiveshotline/counties/fixtures/counties.json
          oregoninvasiveshotline/species/fixtures/severity.json
          oregoninvasiveshotline/species/fixtures/category.json
          oregoninvasiveshotline/species/fixtures/species.json

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Show Docker logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Clean up
        if: always()
        run: docker compose down -v
