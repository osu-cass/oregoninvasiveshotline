name: Playwright Tests

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      CI: true
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      GOOGLE_MAP_ID: ${{ secrets.GOOGLE_MAP_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Google Maps configuration
        run: |
          test -n "$GOOGLE_API_KEY"
          test -n "$GOOGLE_MAP_ID"

      - name: Create Docker secrets directory
        run: |
          mkdir -p docker/secrets
          printf '%s' 'test-secret-key-for-ci' > docker/secrets/secret_key.txt
          printf '%s' 'invasives' > docker/secrets/db_password.txt
          printf '%s' "$GOOGLE_API_KEY" > docker/secrets/google_api_key.txt
          printf '%s' "$GOOGLE_MAP_ID" > docker/secrets/google_map_id.txt
          chmod 600 docker/secrets/*.txt 

      - name: Set up environment variables
        run: |
          echo "USER_ID=$(id -u)" >> "$GITHUB_ENV"
          echo "GROUP_ID=$(id -g)" >> "$GITHUB_ENV"
          echo "VOLUME_PATH=./volumes" >> "$GITHUB_ENV"

      - name: Create volume directories
        run: |
          mkdir -p "${VOLUME_PATH}/media" "${VOLUME_PATH}/static"
          chown -R "${USER_ID}:${GROUP_ID}" "${VOLUME_PATH}/media" "${VOLUME_PATH}/static"

      - name: Install dependencies
        run: npm ci

      - name: Start application services
        run: docker compose up --build -d postgres rabbitmq app vite

      - name: Show container status
        run: docker compose ps

      - name: Wait for application services
        run: |
          for i in {1..36}; do
            curl --fail --silent --max-time 5 http://localhost:5173/static/@vite/client > /dev/null && break
            echo "Waiting for Vite dev server..."
            sleep 5
          done
          curl --fail --silent http://localhost:5173/static/@vite/client > /dev/null || {
            echo "Vite dev server did not become ready"
            docker compose ps
            exit 1
          }
      
          for i in {1..36}; do
            curl --fail --silent --max-time 5 http://localhost:8000 > /dev/null && break
            echo "Waiting for Django app..."
            sleep 5
          done
          curl --fail --silent http://localhost:8000 > /dev/null || {
            echo "Django app did not become ready"
            docker compose ps
            exit 1
          }
            
      - name: Seed database fixtures
        run: >
          docker compose exec -T app /opt/venv/bin/python manage.py loaddata
          oregoninvasiveshotline/counties/fixtures/counties.json
          oregoninvasiveshotline/species/fixtures/severity.json
          oregoninvasiveshotline/species/fixtures/category.json
          oregoninvasiveshotline/species/fixtures/species.json

      - name: Copy category icons into media volume
        run: docker compose exec -T app /bin/sh -lc 'mkdir -p /media/icons && cp -R /app/media.template/icons/. /media/icons/'

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Show Docker logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Clean up
        if: always()
        run: docker compose down -v
