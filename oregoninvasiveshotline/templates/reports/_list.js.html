  src="https://maps.googleapis.com/maps/api/js?key={{ GOOGLE_API_KEY }}&callback=initMap"
  async
></script>
<script nonce="{{csp_nonce}}">
  /** Initialize the report map and its marker interactions. */
  function initMap() {
      var reports = {{ reports|jsonify }};
      if (reports.length === 0){
          return;
      }

      var options = getDefaultMapOptions();
      var map = new google.maps.Map(document.getElementById('map-canvas'), options);
      var mapTab = document.getElementById('list-map-tab');

      if (mapTab) {
          mapTab.addEventListener('shown.bs.tab', function () {
              var center = map.getCenter();
              google.maps.event.trigger(map, 'resize');
              if (center) {
                  map.setCenter(center);
              }
          });
      }

      // we need to save all the "info windows" we create, so we can close them
      // all when a balloon is clicked (so only one window opens at a time)
      var windows = []

      // for each report, draw the marker on the map where the report was located
      for(var i = 0; i < reports.length; i++){
          var report = reports[i];
          var marker = new google.maps.Marker({
              position: {
                  lat: report.lat,
                  lng: report.lng
              },
              map: map,
              title: report.title,
              icon: generateIcon(report.icon_url),
          });
          report.marker = marker

          var infowindow = new google.maps.InfoWindow({
              content: report.content
          });

          // we keep track of all the
          windows.push(infowindow)

          with({map: map, marker: marker, infowindow: infowindow}){
              google.maps.event.addListener(marker, 'click', function() {
                  for(var i = 0; i < windows.length; i++){
                      windows[i].close()
                  }
                  infowindow.open(map, marker);
              });
          }
      }

      $('.report-location-click').click(function(){
          // The map lives in a tab pane, so switch back to it before opening the marker.
          if (mapTab) {
              bootstrap.Tab.getOrCreateInstance(mapTab).show();
          }
          var index = $(this).data("report-index");
          google.maps.event.trigger(reports[index].marker, 'click');

      });
  }
</script>

<script nonce="{{csp_nonce}}" src="https://cdn.jsdelivr.net/npm/choices.js@11.1.0/public/assets/scripts/choices.min.js"></script>
<script nonce="{{csp_nonce}}">
  document.addEventListener("DOMContentLoaded", function () {
    const categoriesElement = document.querySelector(
      'select[name="categories"]'
    );
    if (categoriesElement) {
      const choicesCategories = new Choices(categoriesElement);

      const clonedCategoriesInput = categoriesElement
        .closest(".choices__inner")
        .querySelector(".choices__input--cloned");
      // We need to add the id to the input element for accessibility
      if (clonedCategoriesInput)
        clonedCategoriesInput.id = "id_categories_input";
    }

    const countiesElement = document.querySelector('select[name="counties"]');
    if (countiesElement) {
      const choicesCounties = new Choices(countiesElement);

      const clonedCountiesInput = countiesElement
        .closest(".choices__inner")
        .querySelector(".choices__input--cloned");
      if (clonedCountiesInput) {
        clonedCountiesInput.id = "id_counties_input";
      }
    }
  });
</script>
